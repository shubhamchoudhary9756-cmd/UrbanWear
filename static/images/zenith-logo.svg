<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F4E5A1"/>
      <stop offset="100%" stop-color="#B8945A"/>
    </linearGradient>
    <linearGradient id="goldGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8945A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6F3F"/>
    </linearGradient>
  </defs>

  <!-- Mountain Icon (3D with depth) -->
  <g>
    <!-- Left Peak -->
    <path d="M290 155 L355 95 L380 130 L360 130 L330 160 Z"
          fill="url(#goldGradientDark)" opacity="0.85"/>

    <!-- Right Peak -->
    <path d="M510 155 L445 95 L420 130 L440 130 L470 160 Z"
          fill="url(#goldGradientDark)" opacity="0.85"/>

    <!-- Center Peak - Left Face (darker for depth) -->
    <path d="M400 55 L440 130 L400 110 Z"
          fill="url(#goldGradientDark)"/>

    <!-- Center Peak - Right Face (lighter) -->
    <path d="M400 55 L440 130 L455 155 L400 110 L400 55 Z"
          fill="url(#goldGradient)"/>

    <!-- Center Peak - Front (main highlight) -->
    <path d="M400 55 L400 110 L380 135 L370 155 L400 110 Z"
          fill="url(#goldGradient)" opacity="0.9"/>

    <!-- Center Peak - Base -->
    <path d="M370 155 L400 110 L430 155 L400 155 Z"
          fill="url(#goldGradientDark)" opacity="0.7"/>
  </g>

  <!-- ZENITH Text (Cinzel Font) -->
  <text x="400" y="330" text-anchor="middle"
        font-family="'Cinzel', 'Playfair Display', Georgia, serif"
        font-size="130"
        font-weight="700"
        letter-spacing="18"
        fill="url(#goldGradient)">
    ZENITH
  </text>

  <!-- Divider Lines + Tagline -->
  <g fill="#D4AF37">
    <!-- Left Line -->
    <rect x="170" y="368" width="130" height="1.5"/>
    <!-- Right Line -->
    <rect x="500" y="368" width="130" height="1.5"/>
  </g>

  <!-- Tagline Text -->
  <text x="400" y="375" text-anchor="middle"
        font-family="'Inter', sans-serif"
        font-size="16"
        font-weight="500"
        letter-spacing="9"
        fill="#D4AF37">
    WEAR YOUR HIGHER SELF
  </text>
</svg>