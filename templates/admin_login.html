<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | UrbanWear</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<!-- ==================================================
                    ADMIN LOGIN
================================================== -->

<section class="admin-login-section">

    <div class="admin-login-box">

        <div class="admin-login-icon">
            <i class="fa-solid fa-user-shield"></i>
        </div>

        <h1>Admin Login</h1>

        <p>Access the admin panel</p>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                <div class="flash-messages">

                    {% for message in messages %}

                        <p>{{ message }}</p>

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <form method="POST" action="{{ url_for('admin_login') }}">

            <!-- CSRF TOKEN -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">

                <label for="email">Email Address</label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="admin@urbanwear.com"
                       required>

            </div>


            <div class="form-group">

                <label for="password">Password</label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter admin password"
                       required>

            </div>


            <div class="remember-row">

                <label>

                    <input type="checkbox" name="remember">

                    Remember Me

                </label>

            </div>


            <button type="submit" class="admin-login-btn">

                <i class="fa-solid fa-lock"></i>
                Sign In as Admin

            </button>

        </form>


        <div class="admin-login-footer">

            <a href="{{ url_for('login') }}">
                <i class="fa-solid fa-user"></i>
                User Login
            </a>

        </div>

    </div>

</section>



<!-- ==================================================
                    FOOTER
================================================== -->

<footer class="footer">

    <div class="footer-bottom">

        <p class="copyright">

            © 2026 UrbanWear. All Rights Reserved.

        </p>

    </div>

</footer>

</body>

</html>
