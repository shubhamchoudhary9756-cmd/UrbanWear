{% extends "base.html" %}

{% block title %}Wishlist | Zenith{% endblock %}

{% block content %}

<!-- ==================================================
                    WISHLIST PAGE
================================================== -->

<main class="wishlist-page">

    <section class="wishlist-header">

        <h1>My Wishlist</h1>

        <p>Products you have saved for later</p>

    </section>


    <section class="wishlist-section">

        <div class="wishlist-actions">

            <button type="button"
                    id="clear-wishlist"
                    class="clear-wishlist-btn">

                <i class="fa-solid fa-trash"></i>
                Clear Wishlist

            </button>

        </div>


        <div id="wishlist-items" class="wishlist-items">
            <!-- JavaScript will load wishlist items here -->
        </div>


        <div id="wishlist-empty"
             class="wishlist-empty"
             style="display: none;">

            <div class="wishlist-empty-icon">
                <i class="fa-regular fa-heart"></i>
            </div>

            <h2>Your Wishlist is Empty</h2>

            <p>You haven't added any products to your wishlist yet.</p>

            <a href="/#products" class="continue-shopping">
                <i class="fa-solid fa-bag-shopping"></i>
                Continue Shopping
            </a>

        </div>

    </section>

</main>

{% endblock %}
