{% extends "base.html" %}

{% block title %}Login | Zenith{% endblock %}

{% block content %}

<!-- ==================================================
                    LOGIN SECTION
================================================== -->

<section class="login-section">

    <div class="login-box">

        <!-- ============ ZENITH LOGO ============ -->
        <div class="zenith-logo-official centered">

            <svg class="zenith-mountain-icon"
                 viewBox="0 0 200 100"
                 xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="goldGradLogin" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#D4AF37"/>
                        <stop offset="50%" stop-color="#F4E5A1"/>
                        <stop offset="100%" stop-color="#B8945A"/>
                    </linearGradient>
                </defs>
                <path d="M100 15 L125 55 L118 55 L100 30 L82 55 L75 55 Z"
                      fill="url(#goldGradLogin)"/>
                <path d="M55 55 L80 30 L92 48 L80 48 L65 62 Z"
                      fill="url(#goldGradLogin)" opacity="0.85"/>
                <path d="M145 55 L120 30 L108 48 L120 48 L135 62 Z"
                      fill="url(#goldGradLogin)" opacity="0.85"/>
            </svg>

            <h1 class="zenith-brand-name">ZENITH</h1>

            <div class="zenith-tagline-wrapper">
                <span class="zenith-line"></span>
                <span class="zenith-tagline-text">WEAR YOUR HIGHER SELF</span>
                <span class="zenith-line"></span>
            </div>

        </div>
        <!-- ============ LOGO END ============ -->


        <h1>Welcome Back</h1>

        <p>Sign in to your Zenith account</p>


        <form method="POST" action="{{ url_for('login') }}">

            <!-- CSRF TOKEN -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">

                <label for="email">Email</label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

            </div>


            <div class="form-group">

                <label for="password">Password</label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       required>

            </div>


            <div class="remember-row">

                <label>

                    <input type="checkbox" name="remember">

                    Remember Me

                </label>

            </div>


            <button type="submit" class="login-btn">

                Sign In

            </button>

        </form>


        <p class="forgot-password">

            <a href="{{ url_for('forgot_password') }}">
                Forgot Password?
            </a>

        </p>


        <p class="login-link">

            Don't have an account?

            <a href="{{ url_for('signup') }}">
                Create Account
            </a>

        </p>

    </div>

</section>

{% endblock %}
