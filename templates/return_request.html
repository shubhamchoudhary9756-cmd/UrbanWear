{% extends "base.html" %}
{% block title %}Return Order #{{ order.id }} | Zenith{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 50px auto; padding: 0 20px;">
    <div style="background: #fff; border: 1px solid #e8e2d9; border-radius: 8px; padding: 30px;">
        
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="fa-solid fa-rotate-left" style="font-size: 40px; color: #c9a961; margin-bottom: 15px;"></i>
            <h1 style="font-family: 'Playfair Display', serif; font-size: 28px; margin: 0; color: #1a1a1a;">Return Request</h1>
            <p style="color: #888; margin-top: 5px;">Order #{{ order.id }}</p>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; text-transform: uppercase;">Reason for Return *</label>
                <select name="reason" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;">
                    <option value="">Select a reason</option>
                    <option value="Size does not fit">Size does not fit</option>
                    <option value="Received damaged product">Received damaged product</option>
                    <option value="Wrong item delivered">Wrong item delivered</option>
                    <option value="Quality not as expected">Quality not as expected</option>
                </select>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; text-transform: uppercase;">More Details (Optional)</label>
                <textarea name="details" rows="3" placeholder="Tell us what went wrong..." style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; resize: vertical;"></textarea>
            </div>

            <div style="margin-bottom: 30px;">
                <label style="display: block; font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; text-transform: uppercase;">Refund Account Details *</label>
                <input type="text" name="refund_account" required placeholder="UPI ID or Bank Account No + IFSC" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;">
                <p style="font-size: 11px; color: #888; margin-top: 5px;">Amount ₹{{ order.total_amount|inr }} will be refunded here.</p>
            </div>

            <button type="submit" style="width: 100%; padding: 15px; background: #1a1a1a; color: #fff; border: none; font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;">
                Submit Return Request
            </button>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="{{ url_for('order_details', order_id=order.id) }}" style="color: #888; font-size: 13px; text-decoration: underline;">Cancel and go back</a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
