{% extends "base.html" %}

{% block title %}Page Not Found | Zenith{% endblock %}

{% block content %}

<!-- ==================================================
                    ERROR SECTION
================================================== -->

<section class="error-section">

    <div class="error-box">

        <!-- ============ ZENITH LOGO ============ -->
        <div class="zenith-logo-official centered">

            <!-- Mountain Icon -->
            <svg class="zenith-mountain-icon"
                 viewBox="0 0 200 100"
                 xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="goldGrad404" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#D4AF37"/>
                        <stop offset="50%" stop-color="#F4E5A1"/>
                        <stop offset="100%" stop-color="#B8945A"/>
                    </linearGradient>
                </defs>
                <path d="M100 15 L125 55 L118 55 L100 30 L82 55 L75 55 Z"
                      fill="url(#goldGrad404)"/>
                <path d="M55 55 L80 30 L92 48 L80 48 L65 62 Z"
                      fill="url(#goldGrad404)" opacity="0.85"/>
                <path d="M145 55 L120 30 L108 48 L120 48 L135 62 Z"
                      fill="url(#goldGrad404)" opacity="0.85"/>
            </svg>

            <!-- Brand Name -->
            <h1 class="zenith-brand-name">ZENITH</h1>

            <!-- Tagline -->
            <div class="zenith-tagline-wrapper">
                <span class="zenith-line"></span>
                <span class="zenith-tagline-text">WEAR YOUR HIGHER SELF</span>
                <span class="zenith-line"></span>
            </div>

        </div>
        <!-- ============ LOGO END ============ -->


        <!-- 404 CODE -->
        <div class="error-code">
            404
        </div>

        <h2>Page Not Found</h2>

        <p>
            The page you are looking for doesn't exist
            or has been moved.
        </p>

        <a href="/" class="btn-primary">

            <i class="fa-solid fa-house"></i>
            Go Back Home

        </a>

    </div>

</section>

{% endblock %}
