{% extends "base.html" %}

{% block title %}Sign Up | Zenith{% endblock %}

{% block content %}

<!-- ==================================================
                    SIGNUP SECTION
================================================== -->

<section class="signup-section">

    <div class="signup-box">

        <!-- ============ ZENITH LOGO ============ -->
        <div class="zenith-logo-official centered">

            <svg class="zenith-mountain-icon"
                 viewBox="0 0 200 100"
                 xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="goldGradSignup" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#D4AF37"/>
                        <stop offset="50%" stop-color="#F4E5A1"/>
                        <stop offset="100%" stop-color="#B8945A"/>
                    </linearGradient>
                </defs>
                <path d="M100 15 L125 55 L118 55 L100 30 L82 55 L75 55 Z"
                      fill="url(#goldGradSignup)"/>
                <path d="M55 55 L80 30 L92 48 L80 48 L65 62 Z"
                      fill="url(#goldGradSignup)" opacity="0.85"/>
                <path d="M145 55 L120 30 L108 48 L120 48 L135 62 Z"
                      fill="url(#goldGradSignup)" opacity="0.85"/>
            </svg>

            <h1 class="zenith-brand-name">ZENITH</h1>

            <div class="zenith-tagline-wrapper">
                <span class="zenith-line"></span>
                <span class="zenith-tagline-text">WEAR YOUR HIGHER SELF</span>
                <span class="zenith-line"></span>
            </div>

        </div>
        <!-- ============ LOGO END ============ -->


        <h1>Create Account</h1>

        <p>Join Zenith and start shopping</p>


        <form method="POST" action="{{ url_for('signup') }}">

            <!-- CSRF TOKEN -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">

                <label for="full_name">Full Name</label>

                <input type="text"
                       id="full_name"
                       name="full_name"
                       placeholder="Enter your full name"
                       required>

            </div>


            <div class="form-group">

                <label for="email">Email</label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

            </div>


            <div class="form-group">

                <label for="phone">Phone Number</label>

                <input type="text"
                       id="phone"
                       name="phone"
                       placeholder="Enter your phone number"
                       required>

            </div>


            <div class="form-group">

                <label for="password">Password</label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Create password (min 8 chars, A-Z, a-z, 0-9)"
                       required>

            </div>


            <div class="form-group">

                <label for="confirm_password">Confirm Password</label>

                <input type="password"
                       id="confirm_password"
                       name="confirm_password"
                       placeholder="Confirm password"
                       required>

            </div>


            <button type="submit" class="signup-btn">

                Create Account

            </button>

        </form>


        <p class="login-link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Sign In
            </a>

        </p>

    </div>

</section>

{% endblock %}
