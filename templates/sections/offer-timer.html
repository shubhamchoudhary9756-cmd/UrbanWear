<section class="offer-timer-nb">

    <div class="offer-timer-inner">

            <span class="offer-timer-tag">

                FLASH SALE
            </span>

            <h2 class="offer-timer-title">
                Sale Ends In
            </h2>

            <p class="offer-timer-desc">

        </div>

            </div>

        </div>

        <div class="offer-timer-right">

            <a href="#products" class="offer-timer-btn">

        </div>
